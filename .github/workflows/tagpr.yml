name: tagpr

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload assets for
        required: true
        type: string

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: tagpr
        id: tagpr
        if: github.event_name == 'push'
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          TAGPR_TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAGPR_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        if: steps.release.outputs.tag != ''
        run: npm run build

      - name: Upload release assets
        if: steps.release.outputs.tag != ''
        run: |
          gh release upload ${{ steps.release.outputs.tag }} main.js manifest.json styles.css --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
